plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonecyberlab.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.phonecyberlab.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}
